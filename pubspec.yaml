name: livelife
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  # Run `python3 tool/generate_logo_assets.py` before store packaging to
  # materialize the final PNG/ICO logo package from assets/app_logo.svg.
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#0F766E"

flutter:
  uses-material-design: true

  assets:
    - assets/


